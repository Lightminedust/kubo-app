name: CI

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:

jobs:
  check:
    # Kubo is a Windows app: JavaFX natives, DPAPI and the packaged launcher are Windows-specific.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, SSH integration tests and coverage rule
        run: .\gradlew.bat check jacocoTestReport --console=plain

      - name: Test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests
            app/build/reports/jacoco

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: .\gradlew.bat jpackage --console=plain

      - name: Packaged app
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Kubo-windows
          path: app/build/jpackage/Kubo
