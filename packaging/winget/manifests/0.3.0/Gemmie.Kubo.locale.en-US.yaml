ShortDescription: See your Linux server over SSH, drawn instead of tabulated.
Description: |-
  Kubo connects over SSH to a Linux server you own and draws it: the processor as a particle sphere,
  the files as a branching tree that opens column by column, and the way in as a map where the firewall
  is a pane of glass and every port sits where it can truly be reached. Docker, Redis and apt get the
  same treatment.

  Nothing is installed on the server — Kubo only runs ordinary shell commands over SSH, and leaves no
  agent behind. Nothing leaves the operator's machine: no account, no telemetry, no cloud. Every command
  Kubo sends is listed as it happens and written to a local log — the commands, never their output.

  Brings its own Java runtime, so no runtime has to be installed first.
